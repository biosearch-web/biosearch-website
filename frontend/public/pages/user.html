<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../src/styles/global.css">
    <link rel="stylesheet" href="../src/styles/user.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <script type="module" src="../src/index.js"></script>
</head>

<body>
    <app-header></app-header>

    <main>
        <div class="user-image">
            <img id="profileImage" src="" alt="Perfil">
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

        <form id="userForm" class="user-form" action="#" method="post">
            <div class="form-name">
                <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
            </div>
            <div class="form-row">
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="password" id="password" name="password" placeholder="Change Password" required>
                <input type="password" id="password" name="password" placeholder="Confirm Password" required>
            </div>
            <div class="form-row">
                <input type="text" value="12 fotos enviadas" readonly>
                <input type="text" value="5 amizades" readonly>
            </div>
            <button type="submit" class="btn-submit">Salvar Alterações</button>
        </form>
    </main>
        <script src="../src/js/user.js"></script>
</body>

</html>
