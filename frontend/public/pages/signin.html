<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSearch - Sign In</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../src/styles/signin.css">
    <link rel="stylesheet" href="../src/styles/global.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="container-main-image">
                <img src="/frontend/src/assets/logo.png" alt="Logo BioSearch">
            </div>

            <div class="container-form">
                <div class="container-primary-text">
                    <h1>Welcome back</h1>
                    <p>Sign in to continue your journey</p>
                </div>
                <br>
                <div class="container-form-inputs">
                    <form action="/signin" method="POST">
                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Email" required>
                        </div>
                        <br>
                        <div class="input-group">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                        </div>
                        <p><a href="/frontend/pages/passwordrecover.html">Forgot your password?</a></p>
                </div>
                <button type="submit">
                    <p>Sign In</p>
                </button>
                <div class="container-dont-have-account">
                    <p>Doesn’t have an account? <a href="signup.html">Sign up</a></p>
                </div>
                </form>
            </div>
        </div>
        </div>
    </main>
</body>

</html>
