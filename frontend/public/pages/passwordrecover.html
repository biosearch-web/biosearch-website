<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSearch - Password Recover</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../src/styles/passwordrecover.css">
    <link rel="stylesheet" href="../src/styles/global.css">
    <script src="../src/js/passwordRecover.js"></script>

</head>

<body>
    <main>
        <div class="container">
            <div class="container-main-image">
                <img src="/frontend/src/assets/logo.png" alt="Logo BioSearch">
            </div>

            <div class="container-form">
                <div class="container-primary-text">
                    <h1>Reset your password</h1>
                    <p>Enter your account email and we'll send you a link to reset your password.</p>
                </div>
                <br>
                <div class="container-form-inputs">
                    <form action="reset" method="POST" id="recoverForm">
                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Email" required>
                        </div>
                        <button type="submit">Sent reset link</p>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
