<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSearch - Password Recover</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../src/styles/passwordsucess.css">
    <link rel="stylesheet" href="../src/styles/global.css">

</head>

<body>
    <main>
        <div class="container">
            <div class="container-main-image">
                <img src="/frontend/src/assets/logo.png" alt="Logo BioSearch">
            </div>

            <div class="container-form">
                <div class="sucess-message">
                    <img src="../src/assets/check.png" alt="Check" width="45px">
                    <h1>Email sent!</h1>
                    <br>
                    <p>We've sent a link to your email. Check your inbox and spam folder. The link expires in 30
                        minutes.</p>
                </div>
                <p>Didn't receive it? Wait 1 minute before trying again.</p>
                <br>
                <button class="btn btn-resend" type="button">Resend Email</button>
                <button class="btn btn-send" type="button">Send reset link</button>
            </div>
        </div>
    </main>
</body>

</html>
