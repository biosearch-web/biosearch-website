<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSearch - Create your Account</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/global.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="container-main-image">
                <img src="../assets/logo.png" alt="Logo BioSearch">
            </div>

            <div class="container-form">
                <div class="container-primary-text">
                    <h1>Create your account</h1>
                    <p>Fill in your details to start exploring biodiversity</p>
                </div>

                <div class="container-form-inputs">
                    <form action="home.html" method="GET">

                        <div class="input-name">
                            <input type="text" id="first-name" name="first_name" placeholder="First Name" required>
                            <input type="text" id="last-name" name="last_name" placeholder="Last Name" required>
                        </div>

                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Email" required>
                        </div>

                        <div class="input-group">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                        </div>

                        <div class="input-group">
                            <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password" required>
                        </div>

                        <button type="submit">
                            Create account
                        </button>

                        <div class="container-dont-have-account">
                            <p>Already have an account? <a href="signin.html">Sign in</a></p>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
